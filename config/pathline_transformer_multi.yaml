# 迹线 Transformer 涡提取 —— 多数据集联合训练配置（票 07 延伸）
#
# 与单数据集配置（pathline_transformer_cylinder.yaml）的差异（HANDOFF §1 决策 8
# 落实 + §6 参数表更新）：
# - data.root = 6 个 prepare_dataset 产物目录列表（含既有 pipedcylinder2d；
#   各目录由 prepare_multi.py 逐数据集预处理生成，mask 随数据集、不进模型输入）。
#   2026-08-29 用户决策：**forceddampedduffing2d 移出训练池**（用户判定该数据集
#   有问题，7→6 roots）。配置中的 6 个 root 是训练池唯一来源；服务器只需同步这些
#   memmap 目录，不必上传未使用的数据集；
# - 时间划分 = frac 60/40（各数据集帧前 60% 训 / 后 40% 测，无 val 片）——
#   训练期无 val 监控（main 警告并跳过）；留出评估用
#   `--report-f1 --f1-split test`（跨数据集 test 片自然分布 F1/IoU 记录）；
# - τ/归一化逐数据集各自（各 meta 的 p85 分位 τ、ivd μ/σ、speed_max）；
# - run_name/ckpt_dir 独立（与单数据集训练产物不混写）；
# - **结算口径 130 epoch**（HANDOFF §1/§6；最终 checkpoint 归档于 outputs/_ckpt130）。
#
# 服务器用法（Remote-SSH 终端）：
#   CUDA_VISIBLE_DEVICES=0 python train_kaggle.py \
#     --config config/pathline_transformer_multi.yaml --resume auto \
#     --report-f1 --f1-split test

# ---------------------------------------------------------------------------- 数据
data:
  root:
    - outputs/datasets/boussinesq/dataset
    - outputs/datasets/cylinder2d/dataset
    - outputs/datasets/doublegyre2d/dataset
    - outputs/datasets/fourcenters2d/dataset
    - outputs/datasets/jungtelziemniak2d/dataset
    - outputs/datasets/pipedcylinder2d/dataset
  split: train                   # 训练片 = 各数据集前 60%（frac 口径）
  val_split: none                # 无 val 片（60/40 留出；监控跳过；留出评估 =
                                 # --report-f1 --f1-split test）
  batch_size: 100
  num_workers: 8                 # SHU-server 40 核；共享资源紧张时可降至 4
  samples_per_epoch: 20000       # HANDOFF §6 默认值；按服务器 GPU 实测可调
  positive_fraction: 0.5         # 50% 正样本过采样（联合池）
  patch_size: [32, 32]
  stride: [16, 16]
  t_win: 24
  window_step: 4
  t_scale: 0.25                  # KNN 时空混合度量中 t 的权重
  groups: [8, 8]
  delta_frac: 0.05
  L: 16
  n_substeps: 4
  seed: 0

# ---------------------------------------------------------------------------- 模型
model:
  NAME: BaseSeg
  encoder_args:
    NAME: PathlineTransformerV0
    in_channels: 7
    PathlineGroups: 64
    KpathlinePerGroup: 4
    num_classes: 1
    num_encoder_layers: 3
    dmodel: 144
    k: 16
  criterion_args:
    NAME: BCELoss

# ---------------------------------------------------------------------------- 训练
train:
  epochs: 130                     # 多数据集联合线结算口径
  lr: 0.0001
  weight_decay: 0.000001
  warmup_epochs: 60
  second_lr: 0.000005
  grad_clip: 1.0
  val_freq: 10                   # 无 val 片时实际不触发（监控跳过）
  save_freq: 30
  seed: 0
  device: auto
  amp: false                     # 上游模型 AMP 不兼容（HANDOFF §7）
  data_parallel: false           # 服务器默认只占 CUDA_VISIBLE_DEVICES 指定的空闲 GPU
  ckpt_dir: outputs/train_multi
  run_name: pathline_transformer_multi
